[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crystal-ball"
version = "0.1.0"
description = "Predict future incidents from your code"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.24",
    "rich>=14.0",
    "GitPython>=3.1",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
crystal = "crystal_ball.cli:main"
crystal-ball = "crystal_ball.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["crystal_ball*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
