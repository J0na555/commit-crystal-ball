[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "commit-crystal-ball"
version = "0.1.0"
description = "Predict future incidents from your code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.24",
    "rich>=14.0",
    "GitPython>=3.1",
]

[project.scripts]
crystal-ball = "crystal_ball.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["crystal_ball*"]
